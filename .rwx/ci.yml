on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        publish: false
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        publish: true
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      publish: false

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.1.0
    with:
      repository: https://github.com/rwx-cloud/rwx-package-template.git
      ref: ${{ init.commit-sha }}

  - key: rwx-cli
    call: rwx/install-cli 4.1.0

  - key: package
    use: [code, rwx-cli]
    run: |
      DIGEST=$(rwx package build --format json | jq -r '.Digest')
      echo "Uploaded package with digest: ${DIGEST}"
      echo "${DIGEST}" > "${RWX_VALUES}/digest"

  - key: test
    call: ${{ run.dir }}/test.yml
    init:
      package-digest: ${{ tasks.package.values.digest }}

  # To publish, create a service account with the package:publish permission and add it to
  # a vault
  - key: publish
    use: rwx-cli
    after: test
    if: ${{ init.publish }}
    run: rwx package publish "${DIGEST}"
    env:
      DIGEST: ${{ tasks.package.values.digest }}
      RWX_ACESS_TOKEN: ${{ vaults.repo_main.service-accounts.package-publisher.token }}
