on:
  github:
    pull_request:
      init:
        commit-sha: ${{ event.git.sha }}
        publish: false
    push:
      if: ${{ event.git.branch == 'main' }}
      init:
        commit-sha: ${{ event.git.sha }}
        publish: true
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      publish: false

base:
  image: ubuntu:24.04
  config: rwx/base 1.0.0

tasks:
  - key: code
    call: git/clone 2.0.3
    with:
      repository: https://github.com/rwx-cloud/rwx-package-template.git
      ref: ${{ init.commit-sha }}
      github-token: ${{ github['rwx-cloud'].token }}

  - key: package
    use: code
    call: 9cee3ec5fcf026ebf1eab7bcfa1a93b80f9be42d2695df63242015bde714350d

  - key: test
    call: ${{ run.dir }}/test.yml
    init:
      package-digest: ${{ tasks.package.values.digest }}

  - key: publish
    after: test
    if: ${{ init.publish }}
    run: ...
